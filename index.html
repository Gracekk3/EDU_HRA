
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Quest – Code Runner</title>

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>WEB QUEST</h1>
        <p>Nauč se HTML, CSS a JavaScript hraním!</p>
    </header>

    <main>
        <section id="menu">
            <h2>Vítej ve hře!</h2>
            <p>Chytej správné odpovědi a získávej body.</p>
            <button id="startBtn">Spustit hru</button>
        </section>

        <section id="game">
            <h2>Herní plocha</h2>

            <div id="stats">
                <span id="score">Body: 0</span>
                <span id="lives">Životy: 3</span>
                <span id="level">Level: 1</span>
            </div>

            <h3 id="question">Zde se zobrazí otázka</h3>

            <canvas id="gameCanvas" width="900" height="500"></canvas>
        </section>

        <section id="results">
            <h2>Konec hry</h2>
            <p id="finalScore"></p>
            <button id="restartBtn">Hrát znovu</button>
        </section>
    </main>

    <footer>
        <p>Web Quest | Školní projekt 2026</p>
    </footer>

    
    <script src="script.js"></script>
</body>
</html>
